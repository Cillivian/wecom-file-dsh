# Standalone `--patch` overlay template for `dsh web`.
#
# Do not edit the path here: `pnpm web` regenerates `cordis.dev.yml` with this
# checkout's absolute path (see tools/dev-patch.mjs). Prefer installing the
# package as a profile bundle — an overlay only resolves `@deepseek-ai/*` for
# plugin paths inside the profile tree or its linked roots.
#
# This template is kept as documentation of the overlay shape and as the file a
# reader may copy by hand. It points at `src/host/index.ts` on purpose: the
# overlay loads an absolute path outside `node_modules`, where Node's type
# stripping works, so local iteration needs no rebuild. The shipped bundle
# exports `lib/host/index.js` instead.
- insert:
    - id: wecom-picker
      name: '<absolute path to wecom-file-dsh>/src/host/index.ts'
